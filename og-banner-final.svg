<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1A33"/>
      <stop offset="100%" stop-color="#1a3358"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0%" stop-color="#D4A574" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#D4A574" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8BE8B"/>
      <stop offset="100%" stop-color="#B5874F"/>
    </linearGradient>
    <linearGradient id="goldBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B5874F"/>
      <stop offset="50%" stop-color="#E8BE8B"/>
      <stop offset="100%" stop-color="#B5874F"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Subtle stars -->
  <g fill="#ffffff" opacity="0.45">
    <circle cx="80" cy="100" r="1.4"/>
    <circle cx="180" cy="60" r="1.1"/>
    <circle cx="1100" cy="80" r="1.5"/>
    <circle cx="1140" cy="180" r="1.2"/>
    <circle cx="60" cy="490" r="1.3"/>
    <circle cx="1140" cy="490" r="1.3"/>
  </g>

  <!-- Logo + Brand text group (center y=235, compact) -->
  <g transform="translate(20, 0)">
    <!-- LEFT: Logo mark -->
    <g transform="translate(245, 235)">
      <circle r="110" fill="#0B1A33" stroke="#D4A574" stroke-width="3"/>
      <g transform="scale(4.3)">
        <g transform="translate(-16, -16)">
          <path d="M6 22 L16 8 L26 22 L22 22 L16 14 L10 22 Z" fill="url(#gold)"/>
        </g>
      </g>
    </g>

    <!-- Vertical divider -->
    <line x1="395" y1="180" x2="395" y2="290" stroke="#D4A574" stroke-width="1.5" opacity="0.5"/>

    <!-- RIGHT: NOAH + MARKETING GROUP -->
    <text x="430" y="245" font-family="Inter, 'Pretendard', sans-serif" font-size="100" font-weight="900" fill="#ffffff" letter-spacing="4">NOAH</text>
    <text x="433" y="290" font-family="Inter, 'Pretendard', sans-serif" font-size="32" font-weight="700" fill="#D4A574" letter-spacing="9">MARKETING GROUP</text>
  </g>

  <!-- Bottom gold accent band — eye-catching proof zone -->
  <rect x="100" y="425" width="1000" height="100" rx="14" fill="rgba(212,165,116,0.12)" stroke="url(#goldBand)" stroke-width="2.5"/>
  <text x="600" y="467" text-anchor="middle" font-family="Inter, 'Pretendard', sans-serif" font-size="38" font-weight="800" fill="url(#gold)" letter-spacing="2">평균 ROAS 382%</text>
  <text x="600" y="503" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="19" font-weight="600" fill="#ffffff" opacity="0.92" letter-spacing="1">374건 운영 검증 · 전문직·바이럴·DB 통합 마케팅</text>

  <!-- URL footer -->
  <text x="600" y="575" text-anchor="middle" font-family="Inter, sans-serif" font-size="19" font-weight="500" fill="#D4A574" letter-spacing="6" opacity="0.8">noahgroup.co.kr</text>
</svg>
