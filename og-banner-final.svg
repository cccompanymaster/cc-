<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1A33"/>
      <stop offset="100%" stop-color="#1a3358"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0%" stop-color="#D4A574" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#D4A574" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8BE8B"/>
      <stop offset="100%" stop-color="#B5874F"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Subtle stars -->
  <g fill="#ffffff" opacity="0.45">
    <circle cx="80" cy="100" r="1.4"/>
    <circle cx="180" cy="60" r="1.1"/>
    <circle cx="60" cy="540" r="1.3"/>
    <circle cx="200" cy="560" r="1.2"/>
    <circle cx="1100" cy="80" r="1.5"/>
    <circle cx="1140" cy="180" r="1.2"/>
    <circle cx="1060" cy="540" r="1.3"/>
  </g>

  <!-- Center-aligned logo + divider + 2-line text group -->
  <g id="brand-group" transform="translate(17, 0)">
    <!-- LEFT: Logo mark -->
    <g transform="translate(240, 315)">
      <circle r="135" fill="#0B1A33" stroke="#D4A574" stroke-width="3"/>
      <g transform="scale(5.2)">
        <g transform="translate(-16, -16)">
          <path d="M6 22 L16 8 L26 22 L22 22 L16 14 L10 22 Z" fill="url(#gold)"/>
        </g>
      </g>
    </g>

    <!-- Vertical divider (shortened to match 2-line text height) -->
    <line x1="445" y1="245" x2="445" y2="380" stroke="#D4A574" stroke-width="1.5" opacity="0.5"/>

    <!-- RIGHT: 2-line brand text (NOAH + MARKETING GROUP), vertical center matched to logo -->
    <text x="490" y="320" font-family="Inter, 'Pretendard', sans-serif" font-size="120" font-weight="900" fill="#ffffff" letter-spacing="4">NOAH</text>
    <text x="493" y="370" font-family="Inter, 'Pretendard', sans-serif" font-size="38" font-weight="700" fill="#D4A574" letter-spacing="11">MARKETING GROUP</text>
  </g>
</svg>
