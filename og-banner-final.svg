<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a161d"/>
      <stop offset="100%" stop-color="#2b2530"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0%" stop-color="#C2A36B" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#C2A36B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DCC9A0"/>
      <stop offset="100%" stop-color="#9A7D4A"/>
    </linearGradient>
    <linearGradient id="goldBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9A7D4A"/>
      <stop offset="50%" stop-color="#DCC9A0"/>
      <stop offset="100%" stop-color="#9A7D4A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Subtle stars -->
  <g fill="#ffffff" opacity="0.45">
    <circle cx="90" cy="90" r="1.4"/>
    <circle cx="190" cy="58" r="1.1"/>
    <circle cx="1090" cy="80" r="1.5"/>
    <circle cx="1140" cy="170" r="1.2"/>
    <circle cx="70" cy="500" r="1.3"/>
    <circle cx="1130" cy="500" r="1.3"/>
  </g>

  <!-- Centered logo + brand (single brand: 노아 / NOAH) -->
  <!-- Logo circle -->
  <g transform="translate(600, 232)">
    <circle r="118" fill="#1a161d" stroke="#C2A36B" stroke-width="3"/>
    <g transform="scale(4.6)">
      <g transform="translate(-16, -16)">
        <path d="M6 22 L16 8 L26 22 L22 22 L16 14 L10 22 Z" fill="url(#gold)"/>
      </g>
    </g>
  </g>

  <!-- NOAH wordmark -->
  <text x="600" y="425" text-anchor="middle" font-family="Inter, 'Pretendard', sans-serif" font-size="104" font-weight="900" fill="#ffffff" letter-spacing="14">NOAH</text>
  <text x="600" y="462" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="22" font-weight="600" fill="#C2A36B" letter-spacing="14">노 아</text>

  <!-- Bottom gold accent band — proof zone -->
  <rect x="170" y="500" width="860" height="78" rx="13" fill="rgba(194,163,107,0.12)" stroke="url(#goldBand)" stroke-width="2.5"/>
  <text x="600" y="535" text-anchor="middle" font-family="Inter, 'Pretendard', sans-serif" font-size="30" font-weight="800" fill="url(#gold)" letter-spacing="1">노출이 아니라, 매출을 만듭니다</text>
  <text x="600" y="562" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="16" font-weight="600" fill="#ffffff" opacity="0.9" letter-spacing="1">전문직 · 바이럴 · 데이터 통합 마케팅 · noahgroup.co.kr</text>
</svg>
