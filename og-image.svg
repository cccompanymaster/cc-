<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1A33"/>
      <stop offset="100%" stop-color="#1a3358"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0%" stop-color="#D4A574" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#D4A574" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8BE8B"/>
      <stop offset="100%" stop-color="#B5874F"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Centered logo mark (same arrow shape as header logo) -->
  <g transform="translate(600,260)">
    <circle r="150" fill="#0B1A33" stroke="#D4A574" stroke-width="2.5"/>
    <g transform="translate(-90,-90) scale(5.625)">
      <path d="M6 22 L16 8 L26 22 L22 22 L16 14 L10 22 Z" fill="url(#gold)"/>
    </g>
  </g>

  <!-- Brand name -->
  <text x="600" y="490" text-anchor="middle" font-family="Inter, 'Pretendard', sans-serif" font-size="56" font-weight="800" letter-spacing="6" fill="#ffffff">NOAH</text>
  <text x="600" y="540" text-anchor="middle" font-family="Inter, 'Pretendard', sans-serif" font-size="22" font-weight="600" letter-spacing="14" fill="#D4A574">MARKETING GROUP</text>

  <!-- Subtle Korean tag -->
  <text x="600" y="585" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="16" font-weight="400" letter-spacing="3" fill="#ffffff" opacity="0.55">노아마케팅그룹 · noahgroup.co.kr</text>
</svg>
