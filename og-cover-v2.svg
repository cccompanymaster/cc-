<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1A33"/>
      <stop offset="100%" stop-color="#1a3358"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#D4A574" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#D4A574" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8BE8B"/>
      <stop offset="100%" stop-color="#B5874F"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Subtle stars -->
  <g fill="#ffffff" opacity="0.45">
    <circle cx="80" cy="100" r="1.4"/>
    <circle cx="180" cy="60" r="1.1"/>
    <circle cx="60" cy="540" r="1.3"/>
    <circle cx="200" cy="560" r="1.2"/>
    <circle cx="1100" cy="80" r="1.5"/>
    <circle cx="1140" cy="180" r="1.2"/>
    <circle cx="1060" cy="540" r="1.3"/>
    <circle cx="1000" cy="60" r="1.1"/>
  </g>

  <!-- Top decorative gold line -->
  <line x1="500" y1="170" x2="700" y2="170" stroke="#D4A574" stroke-width="2.5" opacity="0.7"/>

  <!-- NOAH (huge) -->
  <text x="600" y="305" text-anchor="middle" font-family="Inter, 'Pretendard', sans-serif" font-size="160" font-weight="900" fill="#ffffff" letter-spacing="8">NOAH</text>

  <!-- MARKETING GROUP (large, gold) -->
  <text x="600" y="385" text-anchor="middle" font-family="Inter, 'Pretendard', sans-serif" font-size="58" font-weight="800" fill="url(#gold)" letter-spacing="16">MARKETING GROUP</text>

  <!-- Korean brand name -->
  <text x="600" y="450" text-anchor="middle" font-family="'Pretendard', sans-serif" font-size="32" font-weight="700" fill="#ffffff" opacity="0.9">노아마케팅그룹</text>

  <!-- Bottom decorative gold line -->
  <line x1="540" y1="490" x2="660" y2="490" stroke="#D4A574" stroke-width="1.5" opacity="0.45"/>

  <!-- URL footer -->
  <text x="600" y="528" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" font-weight="500" fill="#D4A574" letter-spacing="6" opacity="0.8">noahgroup.co.kr</text>
</svg>
