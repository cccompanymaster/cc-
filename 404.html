  <style>
    .err-page {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 80px 20px 40px;
      background: linear-gradient(180deg, #0B1A33 0%, #0a1428 100%);
      color: #fff;
    }
    .err-inner { max-width: 720px; width: 100%; text-align: center; }
    .err-code {
      font-family: 'Inter', sans-serif;
      font-size: clamp(96px, 22vw, 200px);
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #D4A574 0%, #fff 50%, #D4A574 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0 0 24px;
    }
    .err-title {
      font-size: clamp(20px, 4vw, 28px);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 14px;
    }
    .err-desc {
      font-size: 15.5px;
      color: rgba(255,255,255,0.72);
      line-height: 1.7;
      margin: 0 0 36px;
    }
    .err-cards {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      max-width: 560px;
      margin: 0 auto 28px;
    }
    .err-card {
      display: block;
      padding: 18px 20px;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      color: #fff;
      text-decoration: none;
      transition: transform .2s, border-color .2s, background .2s;
      text-align: left;
    }
    .err-card:hover {
      transform: translateY(-2px);
      border-color: #D4A574;
      background: rgba(212,165,116,0.08);
    }
    .err-card b {
      display: block;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .err-card span {
      font-size: 13px;
      color: rgba(255,255,255,0.6);
    }
    .err-back {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 14px 28px;
      background: #D4A574;
      color: #0B1A33;
      font-weight: 700;
      border-radius: 999px;
      text-decoration: none;
      transition: transform .2s, box-shadow .2s;
    }
    .err-back:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(212,165,116,0.3);
    }
    @media (max-width: 480px) {
      .err-cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="err-page" role="main">
    <div class="err-inner">
      <h1 class="err-code" aria-label="404 에러">404</h1>
      <p class="err-title">페이지를 찾을 수 없습니다</p>
      <p class="err-desc">
        요청하신 주소가 변경되었거나 삭제되었을 수 있습니다.<br>
        아래 추천 페이지에서 원하시는 정보를 찾아보세요.
      </p>

      <nav class="err-cards" aria-label="추천 페이지">
        <a class="err-card" href="/">
          <b>홈 →</b>
          <span>노아 메인 페이지</span>
        </a>
        <a class="err-card" href="/articles/">
          <b>아티클 →</b>
          <span>SEO·바이럴 실전 가이드 20편</span>
        </a>
        <a class="err-card" href="/products.html">
          <b>상품 →</b>
          <span>20개 업종 맞춤 마케팅 상품</span>
        </a>
        <a class="err-card" href="/index.html#contact">
          <b>상담 →</b>
          <span>영업일 24시간 내 회신</span>
        </a>
      </nav>

      <a class="err-back" href="/" rel="home">
        <span>홈으로 돌아가기</span>
      </a>
    </div>
  </main>
</body>
</html>
